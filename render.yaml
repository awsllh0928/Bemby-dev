services:
  - type: web
    name: bemby
    runtime: docker
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false # fill in your MongoDB connection string, or use the panel after boot
      - key: MONGODB_DB
        value: bemby
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: bemby-data
      mountPath: /app/data
      sizeGB: 1
